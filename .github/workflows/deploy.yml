name: Deploy Workers to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.worker }}-api
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker:
          - discord
          - github
          - roblox
          - spotify
          - steam
          - admin
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed worker
        id: filter
        run: |
          changed=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=true
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed=true
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            if echo "$files" | grep -Eq "api/${{ matrix.worker }}\.(js|toml)$" ||
               echo "$files" | grep -Eq "\.github/workflows/deploy\.yml$"; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ matrix.worker }} worker
        if: steps.filter.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "api"
          command: deploy --config wrangler.${{ matrix.worker }}.toml
