name: Deploy Workers to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ matrix.worker }}-api
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker:
          - discord
          - github
          - roblox
          - spotify
          - steam
          - admin
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy ${{ matrix.worker }} worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "api"
          command: deploy --config wrangler.${{ matrix.worker }}.toml
